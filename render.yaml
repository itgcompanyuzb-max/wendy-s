# Render Blueprint: one web service + a persistent disk for the database and uploads
services:
  - type: web
    name: wendys-delivery
    runtime: docker
    plan: starter            # a paid plan is required for a persistent disk
    healthCheckPath: /healthz
    disk:
      name: storage
      mountPath: /storage
      sizeGB: 2
    envVars:
      - key: STORAGE_DIR
        value: /storage
      - key: TELEGRAM_GATEWAY_TOKEN
        sync: false          # you type it in the Render dashboard, it is never stored in git
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        value: login_code
      - key: WHATSAPP_TEMPLATE_LANG
        value: ru
      - key: ADMIN_PHONE
        sync: false
      - key: YANDEX_MAPS_KEY
        sync: false
